<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Astro Camisas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Catálogo Exclusivo</h1>
        <p>Escolha seu modelo e faça o pedido direto pelo WhatsApp.</p>
    </header>

    <main class="grid-produtos">
        <article class="cartao-produto">
            <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&w=400&q=80" alt="Camisa Oversized Rux Preta">
            <div class="info-produto">
                <h2>Camisa Oversized Rux</h2>
                <p class="preco">R$ 89,90</p>
                <p class="descricao">Algodão premium</p>
                <a href="https://wa.me/5521999999999?text=Fala!%20Quero%20garantir%20a%20Camisa%20Oversized%20Rux%20Preta." target="_blank" class="btn-comprar">
                    Comprar via WhatsApp
                </a>
            </div>
        </article>

        <article class="cartao-produto">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=400&q=80" alt="Camisa Classic Branca">
            <div class="info-produto">
                <h2>Camisa Classic </h2>
                <p class="preco">R$ 79,90</p>
                <p class="descricao">Caimento ajustado</p>
                <a href="https://wa.me/5521999999999?text=Fala!%20Quero%20garantir%20a%20Camisa%20Classic%20Branca." target="_blank" class="btn-comprar">
                    Comprar via WhatsApp
                </a>
            </div>
        </article>

        <article class="cartao-produto">
            <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=400&q=80" alt="Regata Base Cinza">
            <div class="info-produto">
                <h2>Regata</h2>
                <p class="preco">R$ 59,90</p>
                <p class="descricao">Tecido respirável</p>
                <a href="https://wa.me/5521999999999?text=Fala!%20Quero%20garantir%20a%20Regata%20Base%20Cinza." target="_blank" class="btn-comprar">
                    Comprar via WhatsApp
                </a>
            </div>
        </article>
    </main>
</body>
</html>
